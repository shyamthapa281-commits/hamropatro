<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  
  <!-- Main Emblem Container with Filter -->
  <g filter="url(#shadow)">
    <!-- Calendar Card Base -->
    <rect x="86" y="96" width="340" height="340" rx="36" fill="#ffffff" />
    <!-- Calendar Card Top Header (Crimson) -->
    <path d="M 86 132 C 86 112, 102 96, 122 96 L 390 96 C 410 96, 426 112, 426 132 L 426 186 L 86 186 Z" fill="#b91c1c" />
    
    <!-- Calendar Rings -->
    <circle cx="160" cy="96" r="16" fill="#334155" />
    <circle cx="160" cy="96" r="8" fill="#f8fafc" />
    <circle cx="256" cy="96" r="16" fill="#334155" />
    <circle cx="256" cy="96" r="8" fill="#f8fafc" />
    <circle cx="352" cy="96" r="16" fill="#334155" />
    <circle cx="352" cy="96" r="8" fill="#f8fafc" />

    <!-- Radiant Sun & Traditional Nepali Symbol in Calendar body -->
    <!-- Sun Ray Petals -->
    <g transform="translate(256, 304)">
      <!-- Central Golden Sun -->
      <circle cx="0" cy="0" r="48" fill="url(#goldGrad)" />
      <!-- White Radiant Moon Crescent -->
      <path d="M -24 -24 A 36 36 0 0 0 24 24 A 28 28 0 0 1 -24 -24 Z" fill="#ffffff" opacity="0.95" />
      <!-- Star rays around -->
      <path d="M 0 -72 L 8 -52 L 0 -56 L -8 -52 Z" fill="#b91c1c" />
      <path d="M 0 72 L 8 52 L 0 56 L -8 52 Z" fill="#b91c1c" />
      <path d="M -72 0 L -52 8 L -56 0 L -52 -8 Z" fill="#b91c1c" />
      <path d="M 72 0 L 52 8 L 56 0 L 52 -8 Z" fill="#b91c1c" />
      <path d="M -51 -51 L -37 -43 L -39 -39 L -43 -37 Z" fill="#b91c1c" />
      <path d="M 51 51 L 37 43 L 39 39 L 43 37 Z" fill="#b91c1c" />
      <path d="M 51 -51 L 43 -37 L 39 -39 L 37 -43 Z" fill="#b91c1c" />
      <path d="M -51 51 L -43 37 L -39 39 L -37 43 Z" fill="#b91c1c" />
    </g>

    <!-- Top text in header: पात्रो -->
    <text x="256" y="156" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">हाम्रो पात्रो</text>
    
    <!-- Year & Today Indicator -->
    <text x="256" y="408" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#b91c1c" text-anchor="middle" letter-spacing="3">NEPALI CALENDAR</text>
  </g>
</svg>
