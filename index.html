    <!-- Extension Guard for Web3 Wallet property collisions -->
    <script>
      (function() {
        try {
          const originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && (prop === 'ethereum' || prop === 'solana' || prop === 'web3')) {
              try {
                return originalDefineProperty.call(this, obj, prop, {
                  ...descriptor,
                  configurable: true,
                  writable: true,
                });
              } catch (e) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    obj[prop] = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
            }
            try {
              return originalDefineProperty.call(this, obj, prop, descriptor);
            } catch (err) {
              if (obj === window && (prop === 'ethereum' || prop === 'solana' || prop === 'web3')) {
                return obj;
              }
              throw err;
            }
          };

          // Intercept benign [vite] websocket logs in AI Studio container environment
          const originalConsoleError = console.error;
          console.error = function(...args) {
            const msg = args.map(a => (typeof a === 'string' ? a : (a && a.message) ? a.message : '')).join(' ');
            if (msg.includes('[vite] failed to connect') || msg.includes('[vite]')) {
              return;
            }
            return originalConsoleError.apply(console, args);
          };

          const originalConsoleWarn = console.warn;
          console.warn = function(...args) {
            const msg = args.map(a => (typeof a === 'string' ? a : (a && a.message) ? a.message : '')).join(' ');
            if (msg.includes('[vite] failed to connect') || msg.includes('[vite]')) {
              return;
            }
            return originalConsoleWarn.apply(console, args);
          };

          window.addEventListener('error', function(event) {
            const msg = (event && event.message) ? event.message : '';
            if (
              msg.includes('[vite]') ||
              msg.includes('websocket') ||
              msg.includes('Cannot redefine property: ethereum') ||
              msg.includes('Cannot redefine property') ||
              msg.includes('ethereum')
            ) {
              event.preventDefault?.();
              event.stopPropagation?.();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            const reason = event && event.reason;
            const msg = typeof reason === 'string' ? reason : ((reason && reason.message) ? reason.message : '');
            if (
              msg.includes('[vite]') ||
              msg.includes('websocket') ||
              msg.includes('Cannot redefine property: ethereum') ||
              msg.includes('Cannot redefine property')
            ) {
              event.preventDefault?.();
              event.stopPropagation?.();
              return true;
            }
          }, true);
        } catch (_) {}
      })();
    </script>
