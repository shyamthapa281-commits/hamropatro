    <!-- Extension Guard for Web3 Wallet property collisions -->
    <script>
      (function() {
        try {
          const originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && (prop === 'ethereum' || prop === 'solana' || prop === 'web3')) {
              try {
                return originalDefineProperty.call(this, obj, prop, {
                  ...descriptor,
                  configurable: true,
                  writable: true,
                });
              } catch (e) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    obj[prop] = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
            }
            try {
              return originalDefineProperty.call(this, obj, prop, descriptor);
            } catch (err) {
              if (obj === window && (prop === 'ethereum' || prop === 'solana' || prop === 'web3')) {
                return obj;
              }
              throw err;
            }
          };

          // Safe WebSocket wrapper for Vite HMR in container environments
          if (typeof window !== 'undefined' && window.WebSocket) {
            const NativeWebSocket = window.WebSocket;
            function SafeWebSocket(url, protocols) {
              const isViteHmr = 
                (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping')) ||
                (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) ||
                (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=') || url.includes('24678') || url.includes('5173')));

              if (isViteHmr) {
                const listeners = {};
                const fakeSocket = {
                  readyState: 1,
                  url: String(url),
                  protocol: typeof protocols === 'string' ? protocols : (protocols && protocols[0]) || 'vite-hmr',
                  extensions: '',
                  bufferedAmount: 0,
                  binaryType: 'blob',
                  send: function() {},
                  close: function(code, reason) {
                    fakeSocket.readyState = 3;
                    const ev = { type: 'close', wasClean: true, code: code || 1000, reason: reason || '' };
                    if (typeof fakeSocket.onclose === 'function') fakeSocket.onclose(ev);
                    (listeners['close'] || []).forEach(function(cb) { cb(ev); });
                  },
                  addEventListener: function(type, cb) {
                    if (!listeners[type]) listeners[type] = [];
                    listeners[type].push(cb);
                    if (type === 'open') {
                      setTimeout(function() {
                        const ev = { type: 'open' };
                        if (typeof fakeSocket.onopen === 'function') fakeSocket.onopen(ev);
                        cb(ev);
                      }, 0);
                    }
                  },
                  removeEventListener: function(type, cb) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(function(fn) { return fn !== cb; });
                    }
                  },
                  dispatchEvent: function() { return true; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
                return fakeSocket;
              }
              return new NativeWebSocket(url, protocols);
            }
            SafeWebSocket.prototype = NativeWebSocket.prototype;
            SafeWebSocket.CONNECTING = 0;
            SafeWebSocket.OPEN = 1;
            SafeWebSocket.CLOSING = 2;
            SafeWebSocket.CLOSED = 3;
            window.WebSocket = SafeWebSocket;
          }

          // Intercept benign [vite] websocket logs in AI Studio container environment
          const originalConsoleError = console.error;
          console.error = function(...args) {
            const rawStr = args.map(a => {
              if (typeof a === 'string') return a;
              if (a && a.stack) return a.stack;
              if (a && a.message) return a.message;
              return String(a);
            }).join(' ').toLowerCase();

            if (
              rawStr.includes('[vite]') ||
              rawStr.includes('websocket') ||
              rawStr.includes('closed without opened') ||
              rawStr.includes('failed to connect')
            ) {
              return;
            }
            return originalConsoleError.apply(console, args);
          };

          const originalConsoleWarn = console.warn;
          console.warn = function(...args) {
            const rawStr = args.map(a => {
              if (typeof a === 'string') return a;
              if (a && a.stack) return a.stack;
              if (a && a.message) return a.message;
              return String(a);
            }).join(' ').toLowerCase();

            if (
              rawStr.includes('[vite]') ||
              rawStr.includes('websocket') ||
              rawStr.includes('closed without opened') ||
              rawStr.includes('failed to connect')
            ) {
              return;
            }
            return originalConsoleWarn.apply(console, args);
          };

          window.addEventListener('error', function(event) {
            const msg = (
              (event && event.message) ||
              (event && event.error && event.error.message) ||
              (event && event.error && event.error.stack) ||
              String(event)
            ).toLowerCase();

            if (
              msg.includes('[vite]') ||
              msg.includes('websocket') ||
              msg.includes('closed without opened') ||
              msg.includes('cannot redefine property') ||
              msg.includes('ethereum') ||
              msg.includes('solana')
            ) {
              event.preventDefault?.();
              event.stopPropagation?.();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            const reason = event && event.reason;
            const msg = (
              typeof reason === 'string'
                ? reason
                : (reason && reason.stack)
                ? reason.stack
                : (reason && reason.message)
                ? reason.message
                : String(reason)
            ).toLowerCase();

            if (
              msg.includes('[vite]') ||
              msg.includes('websocket') ||
              msg.includes('closed without opened') ||
              msg.includes('cannot redefine property') ||
              msg.includes('ethereum') ||
              msg.includes('solana')
            ) {
              event.preventDefault?.();
              event.stopPropagation?.();
              return true;
            }
          }, true);

          window.onerror = function(message, source, lineno, colno, error) {
            var str = (String(message) + ' ' + String(source) + ' ' + (error ? String(error.stack || error.message) : '')).toLowerCase();
            if (
              str.includes('websocket') ||
              str.includes('closed without opened') ||
              str.includes('[vite]') ||
              str.includes('vite/client')
            ) {
              return true; // suppresses the benign HMR dev-runner error
            }
          };
        } catch (_) {}

        // Global early capture of PWA beforeinstallprompt on Android/Chrome
        window.__deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        });
      })();
    </script>
